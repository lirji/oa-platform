server {
    listen 8405;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;
    large_client_header_buffers 4 16k;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $oa_app_upstream http://oa-app:8400;
    set $oa_notify_upstream http://oa-notify:8401;
    set $oa_file_upstream http://oa-file:8402;
    set $oa_job_upstream http://oa-job:8403;

    location = /healthz { add_header Cache-Control "no-store" always; return 204; }
    location ^~ /api/v1/notify { proxy_pass $oa_notify_upstream; include /etc/nginx/proxy_params; }
    location ^~ /api/v1/announcements { proxy_pass $oa_notify_upstream; include /etc/nginx/proxy_params; }
    location ^~ /api/v1/file { proxy_pass $oa_file_upstream; include /etc/nginx/proxy_params; }
    location ^~ /api/v1/job { proxy_pass $oa_job_upstream; include /etc/nginx/proxy_params; }
    location ^~ /api/v1/ { proxy_pass $oa_app_upstream; include /etc/nginx/proxy_params; }
    location /assets/ { try_files $uri =404; expires 7d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
