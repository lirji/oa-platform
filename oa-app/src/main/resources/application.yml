server:
  port: ${OA_APP_PORT:8400}
  shutdown: graceful
  max-http-request-header-size: 64KB  # Casdoor access_token 可达 9KB，默认 8KB 会在鉴权前直接 400

spring:
  application:
    name: oa-app
  threads:
    virtual:
      enabled: true          # JDK21 虚拟线程；Phase 0 硬门禁 A 已实测 pinning，结论见 IMPLEMENTATION_PROGRESS.md
  datasource:
    url: jdbc:postgresql://${OA_PG_HOST:localhost}:${OA_PG_PORT:35432}/${OA_PG_DB:oa}
    username: ${OA_PG_USER:oa}
    password: ${OA_PG_PASSWORD:oa_dev_pwd}
    hikari:
      # 按 CPU核数×2 + 有效磁盘数 估算，不盲目调大：
      # 虚拟线程下调大反而更容易把 DB 打满（FINAL_PLAN 9.5）
      maximum-pool-size: ${OA_DB_POOL_MAX:20}
      minimum-idle: 5
      pool-name: oa-hikari
  data:
    redis:
      host: ${OA_REDIS_HOST:localhost}
      port: ${OA_REDIS_PORT:36379}
  kafka:
    bootstrap-servers: ${OA_KAFKA:localhost:39092}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # ★ 必须开：我们按【模块】划分迁移版本号区间（V1 app / V2-V9 org / V10-V19 iam / V20+ 其它），
    # 于是 org 模块后补的 V4 会排在已执行的 V10 之前，被 Flyway 判成 out-of-order 而拒绝启动。
    # 这是"模块各占号段"这个约定的真实代价，接受它的前提是：
    # 各模块拥有互不相交的 schema，跨模块迁移之间没有顺序依赖，乱序执行不会产生错误结果。
    # 若将来出现跨模块的顺序依赖，就该改用时间戳版本号而不是继续开这个开关。
    out-of-order: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

oa:
  version: 0.1.0-SNAPSHOT
  security:
    mode: ${OA_SECURITY_MODE:JWT}
    jwk-set-uri: ${OA_JWT_JWKS:http://localhost:8000/.well-known/jwks}
    issuer: ${OA_JWT_ISSUER:http://localhost:8000}
    audience: ${OA_JWT_AUDIENCE:}
  org:
    tree-cache:
      poll-ms: 5000          # 跨节点收敛上界；Phase 2 接入 Redis 失效总线后可调大
    seed:
      enabled: ${OA_ORG_SEED_ENABLED:false}   # 万人级装载接口，默认不装配
  crypto:
    data-key: ${OA_CRYPTO_DATA_KEY:}          # base64 的 32 字节；不配则用开发默认密钥并告警
  iam:
    enforce: ${OA_IAM_ENFORCE:true}      # 接口权限校验总开关；关掉等于拆掉唯一的安全边界
    data-scope:
      strict: ${OA_DATA_SCOPE_STRICT:true} # 未消费/表或别名错配直接拒绝，生产必须为 true
    bootstrap-admin-user-id: ${OA_BOOTSTRAP_ADMIN:}   # 初始管理员，补一条真实 SUPER_ADMIN 授权
    elevation:
      max-hours: 8             # JIT 提权时长上限
    cache:
      ttl-ms: 300000           # 快照 TTL；实际有效期还会被最近的临时授权到期时刻压低
      l1-max-size: 20000
      l2-enabled: true         # Redis 二级缓存（冷启动/被挤出 L1 时用）
      l2-ttl-seconds: 1800
      # 滚动升级到 V18 期间保持 true，让新节点也观察旧节点推进的全局 epoch；全员升级后改 false。
      legacy-epoch-fence-enabled: ${OA_IAM_LEGACY_EPOCH_FENCE_ENABLED:true}
    outbox:
      enabled: ${OA_IAM_OUTBOX_ENABLED:true} # 角色领域事件可靠投递；不影响 Redis 权限失效链路
      poll-ms: 1000
      batch-size: 100
    abac:
      enabled: ${OA_IAM_ABAC_ENABLED:false} # 先配置/预览策略，再按环境灰度开启
    shadow-verify:
      enabled: true            # 判权影子校验，上线 2 周指标为 0 后可关（R2 兜底）
      sample-rate: 0.01
  authz:
    spicedb:
      enabled: false           # 知识库子域挂 auth-platform SpiceDB，Phase 7 才开
  flow:
    workflow:
      # REMOTE = 接真 workflow-platform（:8300）；LOCAL = 用本地测试替身跑端到端。
      mode: ${OA_WORKFLOW_MODE:REMOTE}
      base-url: ${OA_WORKFLOW_URL:http://localhost:8300}
      # ★ 中台命令必须投到【中台自己的 Kafka】。留空则与业务事件同走 OA 总线，
      #   此时中台永远收不到 start 命令，且发件箱显示投递成功——一种没有错误日志的静默失败。
      kafka-bootstrap: ${OA_WORKFLOW_KAFKA:}
      # 改了 BPMN 才需要置 true：中台的 deploy 端点不做重复过滤，每调一次多一个版本。
      force-deploy: ${OA_WORKFLOW_FORCE_DEPLOY:false}
    outbox:
      poll-ms: 1000
      batch-size: 100
    todo:
      reconcile-ms: 60000      # 与中台对账（生命周期事件是 best-effort，会漏）
    instance:
      reconcile-ms: 60000      # 回绑 processInstanceId + 发现流程已结束（中台不推这两件事）
    approval:
      max-levels: 5
  workflow:
    enabled: false             # 旧开关，保留兼容

# ★ workflow-platform SDK 的开关。默认 false 时注入 NoopWorkflowClient——
#   它的查询【返回空列表且不报错】，于是 RemoteWorkflowGateway 会一边宣称
#   remote()=true 一边什么也查不到：待办不出现、对账"成功地什么都没做"、日志一片干净。
#   OA 用 REMOTE 模式就必须打开它，所以这里直接跟着 mode 走。
workflow:
  client:
    enabled: ${OA_WORKFLOW_CLIENT_ENABLED:true}
    base-url: ${OA_WORKFLOW_URL:http://localhost:8300}
    # 写操作在 SDK 未启用时直接抛错，而不是静默跳过——办理审批悄悄没生效是最坏的一种失败。
    fail-on-disabled-writes: true
