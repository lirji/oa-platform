map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8404;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;
    # Casdoor access_token 实测约 8.8KB；默认单 header 8KB 会在反代前直接 400。
    large_client_header_buffers 4 16k;

    # Docker 服务重建会换 IP；proxy_pass 写死主机名只在 nginx 启动时解析一次，滚动更新后会 502。
    # 通过内置 DNS + 变量让上游按 TTL 重解析，不要求控制台镜像跟每个后端一起重建。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $oa_app_upstream http://oa-app:8400;
    set $oa_notify_upstream http://oa-notify:8401;
    set $oa_file_upstream http://oa-file:8402;
    set $oa_job_upstream http://oa-job:8403;

    location = /healthz {
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # 四个上游的前缀与 vite.config.ts 完全一致。nginx 选择最长前缀，
    # 独立服务必须单列，避免请求被静默打到 oa-app。
    location ^~ /api/v1/notify {
        proxy_pass $oa_notify_upstream;
        include /etc/nginx/proxy_params;
    }
    location ^~ /api/v1/announcements {
        proxy_pass $oa_notify_upstream;
        include /etc/nginx/proxy_params;
    }
    location ^~ /api/v1/file {
        proxy_pass $oa_file_upstream;
        include /etc/nginx/proxy_params;
    }
    location ^~ /api/v1/job {
        proxy_pass $oa_job_upstream;
        include /etc/nginx/proxy_params;
    }
    location ^~ /api/v1/ {
        proxy_pass $oa_app_upstream;
        include /etc/nginx/proxy_params;
    }

    location /ws {
        # query 里只有 30 秒一次性 ticket，但仍不把它写进 access log。
        access_log off;
        proxy_pass $oa_notify_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
