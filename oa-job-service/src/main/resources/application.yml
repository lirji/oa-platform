server:
  port: ${OA_JOB_PORT:8403}
  shutdown: graceful

spring:
  application:
    name: oa-job-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${OA_PG_HOST:localhost}:${OA_PG_PORT:35432}/${OA_PG_DB:oa}
    username: ${OA_PG_USER:oa}
    password: ${OA_PG_PASSWORD:oa_dev_pwd}
  data:
    redis:
      host: ${OA_REDIS_HOST:localhost}
      port: ${OA_REDIS_PORT:36379}
  kafka:
    bootstrap-servers: ${OA_KAFKA:localhost:39092}
  flyway:
    # 跑批自己的表（oa_sys.job_run）由本服务迁移，独立历史表 —— 同 notify 的理由：
    # 与 oa-app 共用一张历史表会让两边互判对方版本为"未知"而拒绝启动。
    enabled: true
    locations: classpath:db/migration/job
    table: flyway_schema_history_job
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

oa:
  security:
    mode: DEV               # Phase 2 接入 Casdoor 后改 JWT
