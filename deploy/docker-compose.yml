# OA Platform 本地基建。
# 纪律（auth/risk/workflow 三个项目都踩过）：
#   ① 独立 project name，避免与其它 compose 互相 kill；
#   ② 端口全部变量化；
#   ③ 起之前先 `docker compose -p oa-platform down --remove-orphans` 清 docker-proxy 残留。
# 端口避让：9092 属 langchain4j / 29092 属 workflow / 15432 属 auth / 25432 属 workflow —— 一律不动。
name: oa-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: oa-postgres
    ports:
      - "${OA_PG_HOST_PORT:-35432}:5432"
    environment:
      POSTGRES_DB: ${OA_PG_DB:-oa}
      POSTGRES_USER: ${OA_PG_USER:-oa}
      POSTGRES_PASSWORD: ${OA_PG_PASSWORD:-oa_dev_pwd}
      # 万人级：组织树/权限快照重算是短事务高频，日志别刷屏
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    volumes:
      - oa-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OA_PG_USER:-oa} -d ${OA_PG_DB:-oa}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: oa-redis
    ports:
      - "${OA_REDIS_HOST_PORT:-36379}:6379"
    # 权限快照 L2 缓存 + Pub/Sub 失效广播 + 打卡幂等键；正确性不依赖它（丢了回源重算）
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0          # KRaft 单节点；bitnami/kafka 标签已被撤，用官方 arm64 镜像
    container_name: oa-kafka
    ports:
      - "${OA_KAFKA_HOST_PORT:-39092}:39092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 双 listener：容器内其它服务用 kafka:9092，宿主机用 localhost:39092
      # ★ 宿主端口必须与容器内 PLAINTEXT_HOST 端口同号，否则 advertised 地址对不上（workflow 项目踩过）
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:39092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: oa-minio
    ports:
      - "${OA_MINIO_API_PORT:-39000}:9000"
      - "${OA_MINIO_CONSOLE_PORT:-39001}:9001"
    environment:
      MINIO_ROOT_USER: ${OA_MINIO_ROOT_USER:-oaminio}
      MINIO_ROOT_PASSWORD: ${OA_MINIO_ROOT_PASSWORD:-oaminio_dev_pwd}
    command: server /data --console-address ":9001"
    volumes:
      - oa-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  # 应用服务。放在 `apps` profile 下：默认 `up` 只起基建，
  # 本地开发时应用跑在 IDE / java -jar 里更方便调试；
  # 要起全栈就加 --profile apps。
  # 镜像先用 deploy/build-images.sh 构建（不能容器内构建，见 Dockerfile 说明）。
  # ─────────────────────────────────────────────────────────────
  oa-app:
    image: oa-platform/oa-app:${OA_IMAGE_TAG:-local}
    container_name: oa-app
    profiles: ["apps"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      kafka:    { condition: service_healthy }
    ports:
      - "${OA_APP_PORT:-8400}:8400"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OA_APP_PORT: 8400
      # 容器内走服务名，不是 localhost
      OA_PG_HOST: postgres
      OA_PG_PORT: 5432
      OA_PG_DB: ${OA_PG_DB:-oa}
      OA_PG_USER: ${OA_PG_USER:-oa}
      OA_PG_PASSWORD: ${OA_PG_PASSWORD:-oa_dev_pwd}
      OA_REDIS_HOST: redis
      OA_REDIS_PORT: 6379
      OA_KAFKA: kafka:9092
      # ⚠️ 生产必须注入真实密钥，否则敏感字段用的是仓库里写死的开发默认密钥
      OA_CRYPTO_DATA_KEY: ${OA_CRYPTO_DATA_KEY:-}
      OA_IAM_ENFORCE: ${OA_IAM_ENFORCE:-true}
      OA_DATA_SCOPE_STRICT: ${OA_DATA_SCOPE_STRICT:-true}
      OA_IAM_ABAC_ENABLED: ${OA_IAM_ABAC_ENABLED:-false}
      OA_SECURITY_MODE: ${OA_SECURITY_MODE:-JWT}
      OA_JWT_JWKS: ${OA_JWT_JWKS:-http://host.docker.internal:8000/.well-known/jwks}
      OA_JWT_ISSUER: ${OA_JWT_ISSUER:-http://localhost:8000}
      OA_JWT_AUDIENCE: ${OA_JWT_AUDIENCE:-}
      OA_BOOTSTRAP_ADMIN: ${OA_BOOTSTRAP_ADMIN:-}
      OA_ORG_SEED_ENABLED: ${OA_ORG_SEED_ENABLED:-false}
      OA_WORKFLOW_MODE: ${OA_WORKFLOW_MODE:-REMOTE}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8400/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  oa-notify:
    image: oa-platform/oa-notify-service:${OA_IMAGE_TAG:-local}
    container_name: oa-notify
    profiles: ["apps"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports:
      - "${OA_NOTIFY_PORT:-8401}:8401"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OA_NOTIFY_PORT: 8401
      OA_PG_HOST: postgres
      OA_PG_PORT: 5432
      OA_REDIS_HOST: redis
      OA_REDIS_PORT: 6379
      OA_KAFKA: kafka:9092
      OA_PG_DB: ${OA_PG_DB:-oa}
      OA_PG_USER: ${OA_PG_USER:-oa}
      OA_PG_PASSWORD: ${OA_PG_PASSWORD:-oa_dev_pwd}
      # ⚠️ 通知服务内嵌判权引擎，敏感字段解密要用同一把密钥；不注入就是仓库里写死的开发默认值
      OA_CRYPTO_DATA_KEY: ${OA_CRYPTO_DATA_KEY:-}
      OA_IAM_ENFORCE: ${OA_IAM_ENFORCE:-true}
      OA_SECURITY_MODE: ${OA_SECURITY_MODE:-JWT}
      OA_JWT_JWKS: ${OA_JWT_JWKS:-http://host.docker.internal:8000/.well-known/jwks}
      OA_JWT_ISSUER: ${OA_JWT_ISSUER:-http://localhost:8000}
      OA_JWT_AUDIENCE: ${OA_JWT_AUDIENCE:-}
      OA_NOTIFY_WS_MAX: ${OA_NOTIFY_WS_MAX:-20000}
      OA_NOTIFY_WS_TICKET_TTL: ${OA_NOTIFY_WS_TICKET_TTL:-30}
      # 外部渠道默认全关：打开一个没配好凭据的渠道，每条通知都会等一次超时
      OA_NOTIFY_EMAIL_ENABLED: ${OA_NOTIFY_EMAIL_ENABLED:-false}
      OA_NOTIFY_SMS_ENABLED: ${OA_NOTIFY_SMS_ENABLED:-false}
      OA_NOTIFY_WECOM_ENABLED: ${OA_NOTIFY_WECOM_ENABLED:-false}
      OA_NOTIFY_FEISHU_ENABLED: ${OA_NOTIFY_FEISHU_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8401/api/v1/notify/ping || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  oa-file:
    image: oa-platform/oa-file-service:${OA_IMAGE_TAG:-local}
    container_name: oa-file
    profiles: ["apps"]
    depends_on:
      minio:    { condition: service_started }
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports:
      - "${OA_FILE_PORT:-8402}:8402"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OA_FILE_PORT: 8402
      OA_MINIO_ENDPOINT: http://minio:9000
      OA_MINIO_ROOT_USER: ${OA_MINIO_ROOT_USER:-oaminio}
      OA_MINIO_ROOT_PASSWORD: ${OA_MINIO_ROOT_PASSWORD:-oaminio_dev_pwd}
      OA_MINIO_BUCKET: ${OA_MINIO_BUCKET:-oa-files}
      # 文件服务也有自己的元数据表与内嵌判权引擎 —— 没有 PG 它连启动都不该算成功
      OA_PG_HOST: postgres
      OA_PG_PORT: 5432
      OA_PG_DB: ${OA_PG_DB:-oa}
      OA_PG_USER: ${OA_PG_USER:-oa}
      OA_PG_PASSWORD: ${OA_PG_PASSWORD:-oa_dev_pwd}
      OA_REDIS_HOST: redis
      OA_REDIS_PORT: 6379
      OA_CRYPTO_DATA_KEY: ${OA_CRYPTO_DATA_KEY:-}
      OA_IAM_ENFORCE: ${OA_IAM_ENFORCE:-true}
      OA_SECURITY_MODE: ${OA_SECURITY_MODE:-JWT}
      OA_JWT_JWKS: ${OA_JWT_JWKS:-http://host.docker.internal:8000/.well-known/jwks}
      OA_JWT_ISSUER: ${OA_JWT_ISSUER:-http://localhost:8000}
      OA_JWT_AUDIENCE: ${OA_JWT_AUDIENCE:-}
      OA_FILE_MAX: ${OA_FILE_MAX:-50MB}
      OA_FILE_MAX_BYTES: ${OA_FILE_MAX_BYTES:-52428800}
      # 预签名 URL 直连对象存储、绕过应用层判权 —— 时效即泄露窗口，别调大
      OA_FILE_PRESIGN_SECONDS: ${OA_FILE_PRESIGN_SECONDS:-300}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8402/api/v1/file/ping || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  oa-job:
    image: oa-platform/oa-job-service:${OA_IMAGE_TAG:-local}
    container_name: oa-job
    profiles: ["apps"]
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "${OA_JOB_PORT:-8403}:8403"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OA_JOB_PORT: 8403
      OA_PG_HOST: postgres
      OA_PG_PORT: 5432
      OA_REDIS_HOST: redis
      OA_REDIS_PORT: 6379
      OA_KAFKA: kafka:9092
      OA_PG_DB: ${OA_PG_DB:-oa}
      OA_PG_USER: ${OA_PG_USER:-oa}
      OA_PG_PASSWORD: ${OA_PG_PASSWORD:-oa_dev_pwd}
      OA_CRYPTO_DATA_KEY: ${OA_CRYPTO_DATA_KEY:-}
      OA_IAM_ENFORCE: ${OA_IAM_ENFORCE:-true}
      OA_SECURITY_MODE: ${OA_SECURITY_MODE:-JWT}
      OA_JWT_JWKS: ${OA_JWT_JWKS:-http://host.docker.internal:8000/.well-known/jwks}
      OA_JWT_ISSUER: ${OA_JWT_ISSUER:-http://localhost:8000}
      OA_JWT_AUDIENCE: ${OA_JWT_AUDIENCE:-}
      OA_JOB_SHARDS: ${OA_JOB_SHARDS:-16}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8403/api/v1/job/ping || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  oa-console:
    image: oa-platform/oa-console:${OA_IMAGE_TAG:-local}
    container_name: oa-console
    profiles: ["apps"]
    depends_on:
      oa-app:    { condition: service_healthy }
      oa-notify: { condition: service_healthy }
      oa-file:   { condition: service_healthy }
      oa-job:    { condition: service_healthy }
    ports:
      - "${OA_CONSOLE_PORT:-8404}:8404"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8404/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  oa-mobile:
    image: oa-platform/oa-mobile:${OA_IMAGE_TAG:-local}
    container_name: oa-mobile
    profiles: ["apps"]
    depends_on:
      oa-app:    { condition: service_healthy }
      oa-notify: { condition: service_healthy }
      oa-file:   { condition: service_healthy }
      oa-job:    { condition: service_healthy }
    ports:
      - "${OA_MOBILE_PORT:-8405}:8405"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8405/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  oa-pg-data:
  oa-minio-data:
